# The "Deploy" button: GitHub → Actions → "Deploy sctyping.com" → Run workflow → type DEPLOY → Run.
# It only ever runs when someone presses the button (never on a push), logs in to the server over SSH and runs
# scripts/deploy.sh there. One-time setup (repository Settings → Secrets and variables → Actions), see docs/deploy.md:
#   SSH_HOST         the server's address              SSH_USER     the login user
#   SSH_PORT         usually 22                         SSH_KEY      a private key allowed to log in (deploy key)
#   SSH_KNOWN_HOSTS  output of: ssh-keyscan -p <port> <host>
#   APP_DIR          the project folder on the server   RESTART_CMD  how the app restarts, e.g. pm2 restart stenography
name: Deploy sctyping.com

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "No live exam is running right now. Type DEPLOY to continue."
        required: true
        default: ""

# Never two deploys at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_DIR: ${{ secrets.APP_DIR }}
          RESTART_CMD: ${{ secrets.RESTART_CMD }}
        run: |
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS APP_DIR RESTART_CMD; do
            if [ -z "${!name}" ]; then echo "The secret $name is missing: see docs/deploy.md"; exit 1; fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd $(printf '%q' "$APP_DIR") && RESTART_CMD=$(printf '%q' "$RESTART_CMD") bash scripts/deploy.sh"

  refused:
    if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Not deployed: type DEPLOY (capital letters) to confirm that no live exam is running."
          exit 1
